name: LunarEC Polyglot CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1. TypeScript / Next.js
  frontend-web:
    name: 🌐 TypeScript & Next.js Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  # 2. Rust Core Engine
  rust-core:
    name: 🦀 Rust Stock & BOM Engine Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path crates/stock-engine/Cargo.toml

  # 3. Python AI & Analytics
  python-analytics:
    name: 🐍 Python AI Demand Forecasting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s services/ai-analytics

  # 4. Go POS Gateway
  go-gateway:
    name: 🐹 Go High-Speed POS Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: cd services/pos-gateway && go test -v ./...
